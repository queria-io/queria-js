<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8" /><title>@queria-io/viz example</title></head>
  <body style="font-family: sans-serif; max-width: 520px; --viz-0: #7846be; --viz-1: #2a9d8f">
    <h2>Web Component</h2>
    <queria-line-chart
      x="year" y="population" by="name" width="480" height="160"
      sql="SELECT year, CASE area WHEN '13224' THEN 'Tama' ELSE 'Musashino' END AS name, any_value(value) AS population
           FROM e_stat.ssds.a_municipal_population
           WHERE area IN ('13224', '13203') AND cat01 = 'A1101' AND value IS NOT NULL
           GROUP BY ALL ORDER BY year"></queria-line-chart>
    <queria-powered-by></queria-powered-by>
    <h2>React</h2>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
