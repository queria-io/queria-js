<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8" /><title>queria example</title></head>
  <body style="font-family: sans-serif; max-width: 520px">
    <h2>Web Component</h2>
    <queria-chart
      api-url=""
      datasets="queria/e_stat"
      spec='{"mark": "line", "height": 160, "encoding": {"x": {"field": "year", "type": "ordinal"}, "y": {"field": "population", "type": "quantitative"}, "color": {"field": "name"}}}'
      sql="SELECT year, CASE area WHEN '13224' THEN 'Tama' ELSE 'Musashino' END AS name, any_value(value) AS population
           FROM e_stat.ssds.a_municipal_population
           WHERE area IN ('13224', '13203') AND cat01 = 'A1101' AND value IS NOT NULL
           GROUP BY ALL ORDER BY year"></queria-chart>
    <queria-powered-by></queria-powered-by>
    <h2>React</h2>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
