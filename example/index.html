<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8" /><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" /><title>queria example</title></head>
  <body style="font-family: sans-serif; max-width: 520px">
    <h2>Web Component</h2>
    <queria-chart
      save-image
      api-url=""
      datasets="queria/e_stat"
      spec='{"mark": "line", "height": 160, "encoding": {"x": {"field": "year", "type": "ordinal"}, "y": {"field": "population", "type": "quantitative"}, "color": {"field": "name"}}}'
      sql="SELECT year, CASE area WHEN '13224' THEN 'Tama' ELSE 'Musashino' END AS name, any_value(value) AS population
           FROM e_stat.ssds.a_municipal_population
           WHERE area IN ('13224', '13203') AND cat01 = 'A1101' AND value IS NOT NULL
           GROUP BY ALL ORDER BY year"></queria-chart>
    <queria-map
      api-url=""
      datasets="queria/e_stat"
      map-style="/style.json"
      layer='{"area": "city", "code": "lg_code", "color": "population", "label": "lg_code"}'
      sql="SELECT area AS lg_code, any_value(value) AS population FROM e_stat.ssds.a_municipal_population
           WHERE area LIKE '13%' AND area &lt; '13300' AND area &lt;&gt; '13100' AND year = 2020 AND cat01 = 'A1101' AND value IS NOT NULL GROUP BY area"></queria-map>
    <queria-powered-by></queria-powered-by>
    <h2>React</h2>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
