name: Release

# Every push to main is checked, and released when its commits call for a
# release: semantic-release reads the Conventional Commits since the last tag
# (fix -> patch, feat -> minor, a breaking change -> minor), tags it, makes a
# GitHub release, and the last step stages that version on npm. A staged
# version goes live only after a maintainer approves it on npmjs.com (or with
# `npm stage approve`) with 2FA. npm authorizes this workflow by trusted
# publishing (OIDC), so no token is stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Sets the version in package.json, tags it and creates the GitHub release; npm publishing is the next step
      - run: npx --yes -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Stage the release on npm. It goes live only after a maintainer approves it on npmjs.com with 2FA
      - name: Stage on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" = "0.0.0-semantic-release" ]; then
            echo "No new release"
            exit 0
          fi
          npx --yes npm@12.2.2 stage publish
